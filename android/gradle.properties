# -Djdk.net.unixdomain.tmpdir works around a machine-level failure on this
# Windows box: the JDK opens every NIO Selector through an AF_UNIX socket
# created under %TEMP%, and both this profile's AppData/Local/Temp and (as
# of whatever changed its ACLs) C:/Windows/Temp reject the socket bind,
# which Gradle reports as "java.io.IOException: Unable to establish
# loopback connection". C:/gtmp is a plain directory created specifically
# for this, with full control for Administrators/SYSTEM/Users -- if this
# breaks again, recheck that directory's ACLs before assuming it's a
# project-level issue.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:/gtmp
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Works around a Windows-specific Kotlin incremental-compilation bug where
# memory-mapped cache files fail to close ("Could not close incremental caches").
kotlin.incremental=false
