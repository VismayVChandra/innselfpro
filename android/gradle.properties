# -Djdk.net.unixdomain.tmpdir works around a machine-level failure on this
# Windows box: the JDK opens every NIO Selector through an AF_UNIX socket
# created under %TEMP%, and this profile's AppData/Local/Temp rejects the
# connect() with "Invalid argument", which Gradle reports as
# "java.io.IOException: Unable to establish loopback connection". Pointing
# the socket file at any other directory fixes it.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:/Windows/Temp
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Works around a Windows-specific Kotlin incremental-compilation bug where
# memory-mapped cache files fail to close ("Could not close incremental caches").
kotlin.incremental=false
